{% extends "base.html" %}

{% block title %}
Sticky Notes -
{% if form.instance.pk %}
Edit
{% else %}
Create
{% endif %}
Note
{% endblock %}

{% block content %}
<div class="page-header">
    <h2>
        {% if form.instance.pk %}
        Edit
        {% else %}
        Create
        {% endif %}
        Note
    </h2>
</div>
<form method="post"
    action="{% if form.instance.pk %}{% url 'edit_note' pk=form.instance.pk %}{% else %}{% url 'create_note' %}{% endif %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        Save
    </button>
</form>
<br>
<a href="{% url 'list_notes' %}">Back to Notes Page</a>
{% endblock %}
